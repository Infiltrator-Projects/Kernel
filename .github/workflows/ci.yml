name: Kernel source and builder contracts
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Verify complete source baseline and licensing
        shell: bash
        run: |
          set -euo pipefail
          for file in Makefile Kconfig COPYING arch/x86/Makefile kernel/sched/core.c mm/memory.c drivers/Makefile scripts/build-native.sh docs/upstream/BASELINE.md docs/upstream/source-id; do
            test -s "$file"
          done
          grep -Fqx 'linux-hwe-7.0=7.0.0-42.42~24.04.1' docs/upstream/source-id
          test -s LICENSES/preferred/GPL-2.0
      - name: Check script syntax and root Kbuild integration (not a kernel compile)
        shell: bash
        run: |
          set -euo pipefail
          make check
          make -n probe | grep -F 'scripts/build-native.sh --probe'
          make -n configure-only SKIP_DEPS=1 | grep -F -- '--skip-deps'
          make -n build-only SKIP_DEPS=1 | grep -F -- '--skip-deps'
          make -n build-only SKIP_DEPS=1 JOBS=1 | grep -F -- '--jobs 1'
          make -n stage-native | grep -F 'scripts/infiltrator/stage-native.sh'
          make -n package-run | grep -F 'scripts/infiltrator/package-run.sh'

      - name: Exercise actual out-of-tree Kbuild configuration generation
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends bc bison flex libelf-dev libssl-dev dwarves
          obj="$RUNNER_TEMP/infiltrator-kbuild-config-test"
          make O="$obj" x86_64_defconfig
          # Simulate inherited distribution certificate paths which are
          # absent from a locally reproduced source checkout.
          scripts/config --file "$obj/.config" --set-str SYSTEM_TRUSTED_KEYS debian/ci-missing-certs.pem
          scripts/config --file "$obj/.config" --set-str SYSTEM_REVOCATION_KEYS debian/ci-missing-revoked.pem
          bash scripts/infiltrator/prepare-certificates.sh "$PWD" "$obj"
          make O="$obj" LOCALVERSION=-infiltrator olddefconfig
          make O="$obj" LOCALVERSION=-infiltrator prepare
          bash scripts/infiltrator/verify-certificate-config.sh "$PWD" "$obj" "$obj/.config"
          test -s "$obj/include/config/auto.conf"
          echo "PASS: real Kbuild prepare materialises verified effective .config"

      - name: Prove nested native Make respects an isolated O= directory
        shell: bash
        run: |
          set -euo pipefail
          obj="$RUNNER_TEMP/infiltrator-nested-kbuild-test"
          # Reproduce the exact inherited sentinel from 'make configure-only':
          # without the reset wrapper, Kbuild ignores O= and writes in src.
          env sub_make_done=1 bash scripts/infiltrator/run-kbuild.sh O="$obj" x86_64_defconfig
          test -s "$obj/.config"
          scripts/config --file "$obj/.config" --set-str SYSTEM_TRUSTED_KEYS debian/ci-absent-certs.pem
          scripts/config --file "$obj/.config" --set-str SYSTEM_REVOCATION_KEYS debian/ci-absent-revocations.pem
          bash scripts/infiltrator/prepare-certificates.sh "$PWD" "$obj"
          env sub_make_done=1 bash scripts/infiltrator/run-kbuild.sh O="$obj" LOCALVERSION=-infiltrator olddefconfig
          env sub_make_done=1 bash scripts/infiltrator/run-kbuild.sh O="$obj" LOCALVERSION=-infiltrator prepare
          bash scripts/infiltrator/verify-certificate-config.sh "$PWD" "$obj" "$obj/.config"
          test -s "$obj/include/config/auto.conf"
          test -s "$obj/include/generated/autoconf.h"
          echo "PASS: nested Kbuild build wrapper preserves O= object directory"
