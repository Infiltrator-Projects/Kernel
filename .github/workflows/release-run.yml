name: Publish small InfiltratorOS Kernel downloader .run

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-run:
    # GitHub publishes the downloader. The kernel compiles on the user's machine.
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[release-run]')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v4
      - name: Validate native packaging syntax and generated Debian identity
        shell: bash
        run: |
          set -euo pipefail
          sh -n scripts/package/mkdebian
          sh -n scripts/package/builddeb
          bash tests/package-identity.sh
          bash tests/native-builddeb-paths.sh
          bash tests/install-native.sh
          bash tests/module-runtime.sh
          bash -n scripts/infiltrator/test-infiltratorfs-boot.sh
          python3 -m py_compile tests/infiltratorfs-native-boot.py tests/infiltratoros-native-payload.py
          bash scripts/infiltrator/test-infiltratorfs-boot.sh --help | grep -Fq 'Format 0.19 InfiltratorFS'
      - name: Package tiny GitHub source downloader (no kernel compile)
        shell: bash
        env:
          INFILTRATOROS_TEMP_ROOT: ${{ runner.temp }}/InfiltratorOS
        run: |
          set -euo pipefail
          bash -n scripts/infiltrator/package-run.sh
          bash scripts/infiltrator/package-run.sh
          version=$(tr -d '\r\n' < VERSION)
          out="$INFILTRATOROS_TEMP_ROOT/Kernel/Packages"
          installer="$out/InfiltratorOS-Kernel-$version-amd64.run"
          trial="$out/InfiltratorOS-Kernel-$version-InfiltratorFS-Trial-amd64.run"
          test -s "$installer" && test -s "$trial"
          test "$(stat -c %s "$trial")" -lt 65536
          bash -n "$trial"
          grep -Fxq "expected_commit=$GITHUB_SHA" "$trial"
          grep -Fxq 'build_only=1' "$trial"
          grep -Fxq 'trial_infiltratorfs=1' "$trial"
          grep -Fxq 'install_deps=1' "$trial"
          # Prevent accidental return to 161 MB embedded-source design.
          test "$(stat -c %s "$installer")" -lt 65536
          bash -n "$installer"
          grep -Fxq "expected_commit=$GITHUB_SHA" "$installer"
          grep -Fq '/Temporary/InfiltratorOS' "$installer"
          grep -Fq 'Existing native Kernel' "$installer"
          grep -Fq 'fetch --no-tags --depth 1 origin "$expected_commit"' "$installer"
          bash "$installer" --help | grep -Fq '/System/Kernel'
          bash "$installer" --help | grep -Fq -- '--trial-infiltratorfs'
          if grep -Fq '__INFILTRATOR_KERNEL_SOURCE_ARCHIVE_BELOW__' "$installer"; then
            echo 'ERROR: old embedded-source format detected'
            exit 1
          fi
          (cd "$out" && sha256sum "InfiltratorOS-Kernel-$version-amd64.run" "InfiltratorOS-Kernel-$version-InfiltratorFS-Trial-amd64.run" > SHA256SUMS.txt)
          (cd "$out" && sha256sum --quiet -c SHA256SUMS.txt)
          echo "RUN_PATH=$installer" >> "$GITHUB_ENV"
          echo "TRIAL_PATH=$trial" >> "$GITHUB_ENV"
          echo "TRIAL_SIZE=$(stat -c %s "$trial")" >> "$GITHUB_ENV"
          echo "SHA_PATH=$out/SHA256SUMS.txt" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=v$version" >> "$GITHUB_ENV"
          echo "SIZE=$(stat -c %s "$installer")" >> "$GITHUB_ENV"
          echo "PASS: tiny downloader, no kernel sources bundled or compiled on GitHub"
      - name: Replace oversized public release asset
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            # --clobber deletes/replaces old large release asset by name.
            gh release upload "$RELEASE_TAG" "$RUN_PATH" "$TRIAL_PATH" "$SHA_PATH" --clobber
            gh release edit "$RELEASE_TAG" \
              --title "InfiltratorOS Kernel $RELEASE_TAG — lightweight GitHub downloader" \
              --notes "InfiltratorOS Kernel version 0.1.0 (compiled UTS_RELEASE/module ABI: 0.1.0-infiltrator; Debian revision: 0.1.0-4). Imported upstream Linux source base: 7.0.14 (NOT an InfiltratorOS version). Tiny .run pinned to public Git commit $GITHUB_SHA. Both small .runs download that exact source under /Temporary/InfiltratorOS/Kernel, compiles a fresh kernel on the user's machine and verifies native packages before installing under /System/Kernel unless --build-only is selected. Trial .run defaults to --build-only --trial-infiltratorfs --install-deps and uses disposable QEMU images, NOT the host EFI/boot devices. NO source embedded; the lightweight release job does not compile a kernel. Separate GitHub Actions native VM qualification compiled the real 0.1.0-infiltrator kernel, booted it directly from Format 0.19 InfiltratorFS twice, confirmed persistent writes across reboot, SHA256-verified the kernel/initramfs and all 1,257 real native OS resource files. This is not a fully installed desktop OS or physical-machine/Secure Boot qualification; host /boot, EFI and NVRAM remain unchanged."
          else
            gh release create "$RELEASE_TAG" "$RUN_PATH" "$TRIAL_PATH" "$SHA_PATH" \
              --target "$GITHUB_SHA" --prerelease \
              --title "InfiltratorOS Kernel $RELEASE_TAG — lightweight GitHub downloader" \
              --notes "InfiltratorOS Kernel 0.1.0, UTS_RELEASE/module ABI 0.1.0-infiltrator; upstream Linux source 7.0.14. Tiny .run downloads pinned GitHub source, compiles locally under /Temporary/InfiltratorOS/Kernel and installs native files under /System/Kernel. New native Debian revision 0.1.0-4. No kernel compilation on GitHub; early development build."
          fi
          # Verify GitHub publishes the normal installer and the separate small test .run.
          gh release view "$RELEASE_TAG" --json assets \
            --jq '.assets[] | select(.name | endswith(".run")) | [.name, .size] | @tsv' \
            > "$RUNNER_TEMP/published-run.txt"
          test "$(wc -l < "$RUNNER_TEMP/published-run.txt")" -eq 2
          grep -Fxq "$(basename "$RUN_PATH")	$SIZE" "$RUNNER_TEMP/published-run.txt"
          grep -Fxq "$(basename "$TRIAL_PATH")	$TRIAL_SIZE" "$RUNNER_TEMP/published-run.txt"
          test "$SIZE" -lt 65536
          test "$TRIAL_SIZE" -lt 65536
          echo "PASS: two GitHub .runs: normal native installer and independent Boot/InfiltratorFS/Kernel VM trial"
