name: Publish small InfiltratorOS Kernel downloader .run

# The release must correspond to the exact source of BOTH successful real
# VM qualifications, not merely to a successful lightweight packaging job.
on:
  workflow_run:
    workflows:
      - "Three-way Boot + InfiltratorFS + Kernel VM qualification"
      - "Qualify independent EXT2 against InfiltratorOS Kernel"
    types: [completed]

permissions:
  contents: write
  actions: read

concurrency:
  group: native-kernel-verified-release-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  publish-run:
    if: github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    steps:
      - name: Gate release on both exact-source successful QEMU qualifications
        env:
          GH_TOKEN: ${{ github.token }}
          QUALIFIED_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          current="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          if [[ "$current" != "$QUALIFIED_SHA" ]]; then
            echo "Skipping superseded kernel revision $QUALIFIED_SHA (main is $current)"
            exit 0
          fi
          runs="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$QUALIFIED_SHA&per_page=100")"
          for workflow in             'Three-way Boot + InfiltratorFS + Kernel VM qualification'             'Qualify independent EXT2 against InfiltratorOS Kernel'; do
            state="$(jq -r --arg name "$workflow" '
              [.workflow_runs[] | select(.name == $name)]
              | sort_by(.created_at, .id) | last
              | [(.status // ""), (.conclusion // "")] | @tsv' <<<"$runs")"
            if [[ "$state" != "$(printf 'completed\tsuccess')" ]]; then
              echo "Release gate waiting: $workflow is $state"
              exit 0
            fi
          done
          echo "READY=true" >> "$GITHUB_ENV"
          echo "QUALIFIED_SHA=$QUALIFIED_SHA" >> "$GITHUB_ENV"
          echo "Both native QEMU qualifications passed for $QUALIFIED_SHA"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v4
        if: env.READY == 'true'
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
      - name: Keep an existing release immutable
        if: env.READY == 'true'
        shell: bash
        run: |
          set -euo pipefail
          version=$(tr -d '\r\n' < VERSION)
          [[ $version =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          previous=$(git rev-parse -q --verify "refs/tags/v$version^{commit}" || true)
          if [[ -n $previous && $previous != "$QUALIFIED_SHA" ]]; then
            echo "Kernel $version is already released; source changes remain unpublished until the version advances."
            echo 'READY=false' >> "$GITHUB_ENV"
          fi
      - name: Install native packaging test dependencies
        if: env.READY == 'true'
        run: sudo apt-get update && sudo apt-get install -y libkmod-dev kmod rsync
      - name: Validate native packaging syntax and generated Debian identity
        if: env.READY == 'true'
        shell: bash
        run: |
          set -euo pipefail
          sh -n scripts/package/mkdebian
          sh -n scripts/package/builddeb
          bash tests/package-identity.sh
          bash tests/native-builddeb-paths.sh
          bash tests/install-native.sh
          bash tests/module-runtime.sh
          bash -n scripts/infiltrator/test-infiltratorfs-boot.sh
          python3 -m py_compile tests/infiltratorfs-native-boot.py tests/infiltratoros-native-payload.py
          bash scripts/infiltrator/test-infiltratorfs-boot.sh --help | grep -Fq 'Format 0.19 InfiltratorFS'
      - name: Package tiny GitHub source downloader (no kernel compile)
        if: env.READY == 'true'
        shell: bash
        env:
          INFILTRATOROS_TEMP_ROOT: ${{ runner.temp }}/InfiltratorOS
        run: |
          set -euo pipefail
          bash -n scripts/infiltrator/package-run.sh
          bash scripts/infiltrator/package-run.sh
          version=$(tr -d '\r\n' < VERSION)
          out="$INFILTRATOROS_TEMP_ROOT/Kernel/Packages"
          installer="$out/InfiltratorOS-Kernel-$version-amd64.run"
          trial="$out/InfiltratorOS-Kernel-$version-InfiltratorFS-Trial-amd64.run"
          test -s "$installer" && test -s "$trial"
          test "$(stat -c %s "$trial")" -lt 65536
          bash -n "$trial"
          grep -Fxq "expected_commit=$QUALIFIED_SHA" "$trial"
          grep -Fxq 'build_only=1' "$trial"
          grep -Fxq 'trial_infiltratorfs=1' "$trial"
          grep -Fxq 'install_deps=1' "$trial"
          # Prevent accidental return to 161 MB embedded-source design.
          test "$(stat -c %s "$installer")" -lt 65536
          bash -n "$installer"
          grep -Fxq "expected_commit=$QUALIFIED_SHA" "$installer"
          grep -Fq '/Temporary/InfiltratorOS' "$installer"
          grep -Fq 'Existing native Kernel' "$installer"
          grep -Fq 'fetch --no-tags --depth 1 origin "$expected_commit"' "$installer"
          bash "$installer" --help | grep -Fq '/System/Kernel'
          bash "$installer" --help | grep -Fq -- '--trial-infiltratorfs'
          if grep -Fq '__INFILTRATOR_KERNEL_SOURCE_ARCHIVE_BELOW__' "$installer"; then
            echo 'ERROR: old embedded-source format detected'
            exit 1
          fi
          (cd "$out" && sha256sum "InfiltratorOS-Kernel-$version-amd64.run" "InfiltratorOS-Kernel-$version-InfiltratorFS-Trial-amd64.run" > SHA256SUMS.txt)
          (cd "$out" && sha256sum --quiet -c SHA256SUMS.txt)
          echo "RUN_PATH=$installer" >> "$GITHUB_ENV"
          echo "TRIAL_PATH=$trial" >> "$GITHUB_ENV"
          echo "TRIAL_SIZE=$(stat -c %s "$trial")" >> "$GITHUB_ENV"
          echo "SHA_PATH=$out/SHA256SUMS.txt" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=v$version" >> "$GITHUB_ENV"
          echo "SIZE=$(stat -c %s "$installer")" >> "$GITHUB_ENV"
          echo "PASS: tiny downloader, no kernel sources bundled or compiled on GitHub"
      - name: Publish exact qualified installer without changing prior releases
        if: env.READY == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$QUALIFIED_SHA"
          current="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          if [[ "$current" != "$QUALIFIED_SHA" ]]; then
            echo "Kernel main changed after qualification; publication skipped"
            exit 0
          fi
          version="$(tr -d '\r\n' < VERSION)"
          test "$RELEASE_TAG" = "v$version"
          out="$(dirname "$RUN_PATH")"
          (cd "$out" && sha256sum -c SHA256SUMS.txt)
          if gh release view "$RELEASE_TAG" --json tagName >/dev/null 2>&1; then
            ref="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG")"
            target="$(jq -r '.object.sha' <<<"$ref")"
            kind="$(jq -r '.object.type' <<<"$ref")"
            if [[ "$kind" == tag ]]; then
              target="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$target" --jq '.object.sha')"
            fi
            test "$target" = "$QUALIFIED_SHA" || {
              echo "Refusing to replace historical release $RELEASE_TAG at $target" >&2
              exit 1
            }
          else
            if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" >/dev/null 2>&1; then
              echo "Release tag already exists without an immutable release; refusing" >&2
              exit 1
            fi
            gh release create "$RELEASE_TAG" "$RUN_PATH" "$TRIAL_PATH" "$SHA_PATH" \
              --target "$QUALIFIED_SHA" --prerelease \
              --title "InfiltratorOS Kernel $version — qualified native downloader" \
              --notes "Kernel and module ABI $version (uname -r, no additional suffix); upstream Linux source 7.0.14. Both QEMU/OVMF native Boot → InfiltratorFS → Kernel and independent EXT2 two-boot qualifications passed for this exact Kernel commit. The two small .run files fetch pinned GitHub source, compile locally, and keep the normal Mint /boot, EFI and NVRAM intact. Physical hardware remains unqualified."
          fi
          downloaded="$RUNNER_TEMP/Kernel-published-release"
          mkdir -p "$downloaded"
          gh release download "$RELEASE_TAG" --dir "$downloaded"
          diff -qr "$out" "$downloaded"
          (cd "$downloaded" && sha256sum --quiet -c SHA256SUMS.txt)
          test "$(find "$downloaded" -maxdepth 1 -type f | wc -l)" = 3
          echo "PASS: immutable Kernel $version release at verified source $QUALIFIED_SHA"
