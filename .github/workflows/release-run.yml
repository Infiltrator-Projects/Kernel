name: Publish small InfiltratorOS Kernel downloader .run

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-run:
    # GitHub publishes the downloader. The kernel compiles on the user's machine.
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[release-run]')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Package tiny GitHub source downloader (no kernel compile)
        shell: bash
        env:
          INFILTRATOROS_TEMP_ROOT: ${{ runner.temp }}/InfiltratorOS
        run: |
          set -euo pipefail
          bash -n scripts/infiltrator/package-run.sh
          bash scripts/infiltrator/package-run.sh
          version=$(tr -d '\r\n' < VERSION)
          out="$INFILTRATOROS_TEMP_ROOT/Kernel/Packages"
          installer="$out/InfiltratorOS-Kernel-$version-amd64.run"
          test -s "$installer"
          # Prevent accidental return to 161 MB embedded-source design.
          test "$(stat -c %s "$installer")" -lt 65536
          bash -n "$installer"
          grep -Fxq "expected_commit=$GITHUB_SHA" "$installer"
          grep -Fq '/Temporary/InfiltratorOS' "$installer"
          grep -Fq 'fetch --no-tags --depth 1 origin "$expected_commit"' "$installer"
          bash "$installer" --help | grep -Fq '/System/Kernel'
          if grep -Fq '__INFILTRATOR_KERNEL_SOURCE_ARCHIVE_BELOW__' "$installer"; then
            echo 'ERROR: old embedded-source format detected'
            exit 1
          fi
          (cd "$out" && sha256sum "InfiltratorOS-Kernel-$version-amd64.run" > SHA256SUMS.txt)
          (cd "$out" && sha256sum --quiet -c SHA256SUMS.txt)
          echo "RUN_PATH=$installer" >> "$GITHUB_ENV"
          echo "SHA_PATH=$out/SHA256SUMS.txt" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=v$version" >> "$GITHUB_ENV"
          echo "SIZE=$(stat -c %s "$installer")" >> "$GITHUB_ENV"
          echo "PASS: tiny downloader, no kernel sources bundled or compiled on GitHub"
      - name: Replace oversized public release asset
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            # --clobber deletes/replaces old large release asset by name.
            gh release upload "$RELEASE_TAG" "$RUN_PATH" "$SHA_PATH" --clobber
            gh release edit "$RELEASE_TAG" \
              --title "InfiltratorOS Kernel $RELEASE_TAG — lightweight GitHub downloader" \
              --notes "Tiny .run pinned to public Git commit $GITHUB_SHA. Executing it downloads the full Kernel source into /Temporary/InfiltratorOS/Kernel and compiles fresh on the user's own Linux machine, then installs native files under /System/Kernel unless --build-only is selected. The source is NOT embedded. This release job does NOT compile the kernel. Early development release; not a qualified bootable OS. Does not modify existing host /boot, EFI or NVRAM."
          else
            gh release create "$RELEASE_TAG" "$RUN_PATH" "$SHA_PATH" \
              --target "$GITHUB_SHA" --prerelease \
              --title "InfiltratorOS Kernel $RELEASE_TAG — lightweight GitHub downloader" \
              --notes "Tiny .run downloads pinned Kernel source from GitHub at runtime, compiles on user's machine under /Temporary/InfiltratorOS/Kernel and installs native files under /System/Kernel. No kernel compilation on GitHub. This is an early development release."
          fi
          # Verify GitHub's public release now has exactly one small .run.
          gh release view "$RELEASE_TAG" --json assets \
            --jq '.assets[] | select(.name | endswith(".run")) | [.name, .size] | @tsv' \
            > "$RUNNER_TEMP/published-run.txt"
          test "$(wc -l < "$RUNNER_TEMP/published-run.txt")" -eq 1
          actual_size=$(awk '{print $2}' "$RUNNER_TEMP/published-run.txt")
          test "$actual_size" -eq "$SIZE"
          test "$actual_size" -lt 65536
          echo "PASS: public GitHub release replaced oversized source-bearing .run with $actual_size-byte downloader"
