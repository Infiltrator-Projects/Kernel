name: Check independent filesystem module ownership

on:
  push:
    branches: [main]
    paths:
      - 'scripts/infiltrator/audit-filesystem-modules.py'
      - 'tests/filesystem-module-ownership.py'
      - 'scripts/infiltrator/prune-external-filesystems.py'
      - 'scripts/build-native.sh'
      - 'tests/nonboot-filesystem-build-profile.py'
      - '.github/workflows/three-way-boot-qualification.yml'
      - '.github/workflows/filesystem-ownership.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Verify shared-owner filesystem duplication gates
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v4
      - name: Compile and execute ownership regression checks
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/infiltrator/audit-filesystem-modules.py tests/filesystem-module-ownership.py scripts/infiltrator/prune-external-filesystems.py tests/nonboot-filesystem-build-profile.py
          python3 tests/filesystem-module-ownership.py
          python3 tests/nonboot-filesystem-build-profile.py
          test -z "$(find . -maxdepth 1 -name '*.ko' -print)"
