# SPDX-License-Identifier: GPL-2.0-only
name: Boot signed Common V2 filesystem module without native format drivers
on:
  push:
    branches: [main]
    paths:
      - 'fs/infiltratr_v2/**'
      - 'include/linux/infiltratr_fs_v2_adapter.h'
      - 'tests/qualify-common-v2-qemu.sh'
      - '.github/workflows/common-v2-signed-mount.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: common-v2-signed-mount-${{ github.ref }}
  cancel-in-progress: true
jobs:
  signed-ext4-mount:
    runs-on: ubuntu-24.04
    timeout-minutes: 85
    steps:
      - name: Checkout InfiltratorOS Kernel
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Install independent image and VM test requirements
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential bc bison flex libelf-dev libssl-dev dwarves \
            openssl cpio busybox-static qemu-system-x86 e2fsprogs curl
          bash -n tests/qualify-common-v2-qemu.sh
      - name: Verify and unpack the published independent EXT4 Common V2 SO
        shell: bash
        run: |
          set -euo pipefail
          package="$RUNNER_TEMP/EXT4-1.0.13.deb"
          curl --retry 3 -fsSL -o "$package" \
            https://github.com/Infiltrator-Projects/Filesystem-EXT4/releases/download/v1.0.13/infiltrator-filesystem-ext4_1.0.13_amd64.deb
          printf '%s  %s\n' 925b80713b9a4a476a352f9e5b73658184a1e32c827eb82f0632dda853a2a24c "$package" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/Provider"
          dpkg-deb -x "$package" "$RUNNER_TEMP/Provider"
          test -s "$RUNNER_TEMP/Provider/System/Filesystems/EXT4.so"
      - name: Configure generic Common V2 Kernel without any native EXT4 driver
        shell: bash
        run: |
          set -euo pipefail
          obj="$RUNNER_TEMP/InfiltratorOS-Kernel-build"
          mkdir -p "$obj"
          make O="$obj" x86_64_defconfig
          scripts/config --file "$obj/.config" \
            -e INFILTRATR_V2_FS -e SYSTEM_DATA_VERIFICATION \
            -e MODULES -e MODULE_SIG -e SYSTEM_TRUSTED_KEYRING \
            -e BLK_DEV_INITRD -e DEVTMPFS -e DEVTMPFS_MOUNT \
            -e VIRTIO -e VIRTIO_PCI -e VIRTIO_BLK \
            -e TTY -e SERIAL_8250 -e SERIAL_8250_CONSOLE \
            -e RD_GZIP \
            -d EXT4_FS -d EXT2_FS -d BTRFS_FS -d XFS_FS \
            -d EXFAT_FS -d NTFS3_FS \
            --set-str SYSTEM_TRUSTED_KEYS '' \
            --set-str SYSTEM_REVOCATION_KEYS ''
          make O="$obj" olddefconfig
          grep -qx 'CONFIG_INFILTRATR_V2_FS=y' "$obj/.config"
          grep -qx 'CONFIG_SYSTEM_DATA_VERIFICATION=y' "$obj/.config"
          grep -qx 'CONFIG_VIRTIO_BLK=y' "$obj/.config"
          grep -qx '# CONFIG_EXT4_FS is not set' "$obj/.config"
          echo "OBJ=$obj" >> "$GITHUB_ENV"
      - name: Compile complete Kernel with the generic SO bridge and trusted signing certificate
        shell: bash
        timeout-minutes: 58
        run: |
          set -euo pipefail
          make O="$OBJ" -j4 bzImage > "$RUNNER_TEMP/V2-Kernel-build.log" 2>&1 || {
            tail -n 130 "$RUNNER_TEMP/V2-Kernel-build.log" >&2
            exit 1
          }
          test -s "$OBJ/arch/x86/boot/bzImage"
          test -s "$OBJ/certs/signing_key.pem"
      - name: Boot, mount and read a signed Common V2 EXT4 SO; reject a modified signature
        shell: bash
        timeout-minutes: 12
        run: |
          set -euo pipefail
          bash tests/qualify-common-v2-qemu.sh \
            "$OBJ/arch/x86/boot/bzImage" \
            "$RUNNER_TEMP/Provider/System/Filesystems/EXT4.so" \
            "$OBJ/certs/signing_key.pem" \
            "$RUNNER_TEMP"
      - name: Preserve build errors only; never export trusted private keys
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: CommonV2-Kernel-Failure-${{ github.sha }}
          path: ${{ runner.temp }}/V2-Kernel-build.log
          if-no-files-found: warn
          retention-days: 7
